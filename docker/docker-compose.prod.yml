version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    ports:
      - "127.0.0.1:18083:3000"
    env_file:
      - ../.env.local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ../data:/app/data:ro


  db:
    image: postgres:16-alpine
    env_file:
      - ../.env.local
    volumes:
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  init-db:
    build:
      context: ..
      dockerfile: docker/Dockerfile.init-db
    env_file:
      - ../.env.local
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - init-db
    networks:
      - app-network
    volumes:
      - ../data:/app/data:ro

networks:
  app-network:
    driver: bridge

volumes:

  postgres_data:






